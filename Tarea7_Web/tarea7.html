<script src="js/jquery-4.0.0.min.js"></script>

<!-- En esta actividad se creara una tabla con los modelos de Audi, en la que habra 3 columnas, 1 fila para el titulo y 5 filas para los modelos 
     en la primer columna van las imagenes, en la segunda columna van los nombres de los modelos y en la tercera columna iran botones con los cuales
     se llamara a una función de JavaScript que ocultara la fila correspondiente por medio de jQuery, el boton debe solicitar al usuario que confirme la acción 
     y lo haremos por medio de la función confirm() de JavaScript, debe ser una sola funcion.-->

<script>

    function ocultarFila(boton) {
        if (confirm("¿Estás seguro de que deseas ocultar esta fila?")) {
            $(boton).closest("tr").hide();
        }
    }


</script>

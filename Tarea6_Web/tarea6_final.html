<html>

 <head>
    <title>Tarea 6 Entrega final</title>

    <script src="js/jquery-4.0.0.min.js"></script>

    <style>

        #mensaje {
            color: rgb(253, 0, 0);
            font-size: 18px;
            font-weight: bold;
            width: 224px;
            height: 30px;
            line-height: 30px;
            background-color: #CCC;
            text-align: center;
            margin: 0 auto;
        }

        #info {
            color: rgb(0, 16, 163);
            font-size: 18px;
            font-weight: bold;
            width: 350px;
            height: auto;
            text-align: center;
            margin: 0 auto;
        }       

    </style>

    <!-- Sintaxis de JavaScript -->

    <!-- Debe haber una función que valide los campos del formulario que esten llenos
        en caso de estar todos llenos se debe mostrar un mensaje div con id info, ya que contendra
        toda la información del usuario, y en caso de no estar todos llenos se debe mostrar un mensaje de error,
        un div con el contenido de "Faltan campos por llenar" y en el caso de los select, la informacion debe aparecer en texto -->

    <script>

        function valida(){

            var nombre = $("#campo1").val();
            var correo = $("input[name='correo']").val();
            var sexo = $("input[name='sexo']:checked").val();
            var boletin = $("input[name='boletin']").is(":checked") ? "Sí" : "No";
            var comentario = $("textarea[name='comentario']").val();
            var carreraValor = $("#carrera").val();
            var carrera = $("#carrera option:selected").text();
            var pass = $("input[name='pasw']").val();
            var promedio = $("input[name='promedio']").val();
            var fecha = $("input[name='fecha']").val();

            if(nombre === "" || correo === "" || !sexo || carreraValor === "0" || pass === "" || promedio === "" || fecha === ""){
                $("#mensaje").html("Faltan campos por llenar");
                setTimeout(function() {
                    $("#mensaje").html("");
                }, 2000);
            } else {
                $("#info").html("Nombre: " + nombre + "<br>Correo: " + correo + "<br>Sexo: " + sexo + 
                "<br>Recibir Boletín: " + boletin + "<br>Comentario: " + comentario + "<br>Carrera: " + carrera + 
                "<br>Contraseña: " + pass + "<br>Promedio: " + promedio + "<br>Fecha de nacimiento: " + fecha);
                setTimeout(function() {
                    $("#info").html("");
                }, 5000);
            }

        }



    </script>        
  
 </head>

 <body>
	<form name="forma01" action="recibe.html" method="POST" align="center">
		<label>
			Nombre:
			<input id="campo1" type="text" name="nombre" placeholder="Escribe tu nombre" required>
		</label>
		
		<br>
		<label>Correo:</label>
		<input type="email" name="correo" placeholder="@udg.mx">
		<br>
		<label for="sexo">Genero:</label>
		<input type="radio" name="sexo" value="F">Femenino
		<input type="radio" name="sexo" value="M">Masculino
		<br>
		<input type="checkbox" name="boletin" value="1" checked>
		<label for="boletin">Recibir Boletín</label>
		<br>
		<label for="comentario">Comentario:</label><br>
		<textarea name="comentario" cols="30" rows="5"></textarea>
		<br>
		<label for="carrera">Carrera:</label>
		<select name="carrera" id="carrera">
			<option value="0" selected>Selecciona</option>
			<option value="1">Ing. Informática</option>
			<option value="2">Ing. Computación</option>			
		</select>
		<br>
		<label for="pasw">Contraseña:</label>
		<input type="password" name="pasw">
		<br>
		<label for="promedio">Promedio:</label>
		<input type="number" name="promedio" min="60" max="100">
		<br>
		<label for="fecha">Fecha nacimiento:</label>
		<input type="date" name="fecha">
		
		<br>
		<input onClick="valida(); return false;" type="submit" value="Enviar con input"/>
        <div id="mensaje"></div>
        <div id="info"></div>
	</form>
	
 </body>

</html>

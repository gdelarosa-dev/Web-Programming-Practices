<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 8 - Tabla 1</title>

<!-- En esta tarea realizaremos lo que parecera una tabla pero en vez de utilizar etiquetas de tabla, usaremos elementos div para crear una estructura similar y con
    css le daremos estilo y caracteristicas a cada DIV recordando que la tabla debe ser de 980px de ancho por 800px de alto, debe tener 2 filas, y una de ellas debe tener 50px de alto 
    mientras que la otra debe estar conformada por 2 columnas y una de ellas debe de ser de 100px de ancho mientras que la otra cubra el resto del espacio
    esto sin usar un display, solo y unicamente div y atributos que cambien el aspecto del div con el fin de generar las tablas-->

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>

        /* Con border-box, el borde y el padding se cuentan dentro del ancho y alto declarado, asi las medidas finales son exactamente las que declaramos */

        div {
            box-sizing: border-box;
        }

        /* Caja principal: 960px ancho por 800px alto */
        .tabla {
            width: 960px;
            height: 800px;
        }

        /* Fila 1: 50px alto, ocupa todo el ancho */
        .fila1 {
            
            width: 960px;
            height: 50px;
            border: 1px solid black;
            padding-left: 5px;
            line-height: 48px; /* Centra verticalmente el texto (50px - 2px de borde) */
        }

        

    </style>

</head>
<body>
    <h1>Tabla 1</h1>

    Tabla: 960px ancho 800px alto
    <!-- Los divs funcionan algo asi como cajas, por lo que todo debe ir dentro de una caja grande, y de ahi subdividir entre las celdas que querramos para nuestro diseño -->
    
    <!-- Caja principal -->
    <div class="tabla">

        <!-- Fila 1 -->
         <div class="fila1"> Fila 50px alto </div>

        <!-- Fila 2 -->
        <div class="fila2">
            
            <!-- Columna 1 -->
            <div class="columna1"> Columna 100px ancho </div>

            <!-- Columna 2 -->
            <div class="columna2"></div>

        </div>



    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 8 - Tabla 1</title>

<!-- En esta tarea realizaremos lo que parecera una tabla pero en vez de utilizar etiquetas de tabla, usaremos elementos div para crear una estructura similar y con
    css le daremos estilo y caracteristicas a cada DIV recordando que la tabla debe ser de 980px de ancho por 800px de alto, debe tener 2 filas, y una de ellas debe tener 50px de alto 
    mientras que la otra debe estar conformada por 2 columnas y una de ellas debe de ser de 100px de ancho mientras que la otra cubra el resto del espacio
    esto sin usar un display, solo y unicamente div y atributos que cambien el aspecto del div con el fin de generar las tablas-->

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>

        /*Nota Importante:
          Cuando un div tiene borde, el borde SE SUMA al ancho y al alto.
          Un borde de 1px agrega 1 px por cada lado, o sea 2px en total.
          Por eso a los divs con borde les restamos 2px a su ancho y alto
          para que el tamaño final sea el deseado. */
        
        /* Caja principal (la tabla completa): 960px ancho por 800px alto */
        .tabla {
            width: 960px;
            height: 800px;        
        }

        /* Fila 1: debe medir 960 px de andho x 50px alto en total. */
        .fila1 {
            width: 958px; /* 960px - 2px del borde */
            height: 48px; /* 50px - 2px del borde */
            border: 1px solid black;
            line-height: 48px; /* Para centrar verticalmente el texto */
        }

        /* Fila 2: Debe ocupar lo que sobra de alto. 800px - 50px = 750px 
           Esta fila no lleva borde, solo sirve como una caja para contener a las 2 columnas */
        .fila2 {
            width: 960px;
            height: 750px; /* 800px - 50px */
        }

        /* Columna 1: debe medir 100px x 750px  en total.
           Con el borde (2px) -> ancho 98px y alto 748px 
           float: left la pega a la izquierda para que la otra columna se coloque a su derecha */
        .columna1 {
            float: left;
            width: 98px; /* 100px - 2px del borde */
            height: 748px; /* 750px - 2px del borde */
            border: 1px solid black;
        }

        /* Columna 2: ocupa el resto del ancho: 960px - 100px = 860px
           Con el borde (2px) -> ancho 858px y alto 748px */
        .columna2 {
            float: left;
            width: 858px; /* 960px - 100px - 2px del borde */
            height: 748px; /* 750px - 2px del borde */
            border: 1px solid black;
        }
        

    </style>

</head>
<body>
    <h1>Tabla 1</h1>

    Tabla: 960px ancho 800px alto
    <!-- Los divs funcionan algo asi como cajas, por lo que todo debe ir dentro de una caja grande, y de ahi subdividir entre las celdas que querramos para nuestro diseño -->
    
    <!-- Caja principal -->
    <div class="tabla">

        <!-- Fila 1 -->
         <div class="fila1"> Fila 50px alto </div>

        <!-- Fila 2 -->
        <div class="fila2">
            
            <!-- Columna 1 -->
            <div class="columna1"> Columna 100px ancho </div>

            <!-- Columna 2 -->
            <div class="columna2"></div>

        </div>



    </div>
</body>
</html>
